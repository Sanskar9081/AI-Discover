<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="faviconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b5ade;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Magnifying Glass Circle -->
  <circle cx="42" cy="42" r="32" fill="none" stroke="url(#faviconGrad)" stroke-width="5"/>
  
  <!-- AI Text (simplified for favicon) -->
  <text x="42" y="48" font-size="28" font-weight="900" font-family="Arial, sans-serif" fill="url(#faviconGrad)" text-anchor="middle" dominant-baseline="middle">AI</text>
  
  <!-- Handle -->
  <line x1="65" y1="65" x2="82" y2="82" stroke="url(#faviconGrad)" stroke-width="5" stroke-linecap="round"/>
</svg>